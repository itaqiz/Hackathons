<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .hero {
    text-align: center;
    color: white;
    margin-bottom: 32px;
  }
  .hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .hero p {
    font-size: 1.1rem;
    opacity: 0.88;
    font-weight: 400;
  }

  .card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 36px;
    width: 100%;
    max-width: 640px;
  }

  .input-group {
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    color: #111;
  }
  input[type="text"]:focus { border-color: #667eea; }
  input[type="text"]::placeholder { color: #9ca3af; }

  .btn {
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 4px 14px rgba(102,126,234,0.4);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(102,126,234,0.5);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-success {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    box-shadow: 0 4px 14px rgba(16,185,129,0.3);
    width: 100%;
    margin-top: 12px;
    padding: 14px;
  }
  .btn-success:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(16,185,129,0.4);
  }

  .section {
    margin-top: 24px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9ca3af;
    margin-bottom: 10px;
  }

  .response-box {
    background: #f8f7ff;
    border: 1px solid #e5e2ff;
    border-radius: 14px;
    padding: 20px;
    font-size: 15px;
    line-height: 1.75;
    color: #374151;
    white-space: pre-wrap;
  }

  .feedback-box {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 14px;
    padding: 20px;
    font-size: 15px;
    line-height: 1.75;
    color: #374151;
    white-space: pre-wrap;
    margin-top: 12px;
  }

  .loading-dots {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #9ca3af;
    font-size: 14px;
    padding: 8px 0;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #667eea;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  textarea {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    resize: vertical;
    min-height: 100px;
    outline: none;
    color: #111;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #10b981; }
  textarea::placeholder { color: #9ca3af; }

  .divider {
    height: 1px;
    background: #f3f4f6;
    margin: 24px 0;
  }

  .tag {
    display: inline-block;
    background: #ede9fe;
    color: #7c3aed;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .footer {
    margin-top: 24px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>🎓 AI Study Buddy</h1>
  <p>Type any topic — get a clear explanation, example, and quiz instantly.</p>
</div>

<div class="card">
  <div class="section-label">What do you want to learn?</div>
  <div class="input-group">
    <input type="text" id="topic" placeholder="e.g. Photosynthesis, Recursion, Newton's Laws..." onkeydown="if(event.key==='Enter') explainTopic()">
    <button class="btn btn-primary" onclick="explainTopic()">✨ Explain</button>
  </div>

  <div id="explanationSection" style="display:none;" class="section">
    <div class="section-label">📖 Explanation</div>
    <div id="explanation" class="response-box"></div>
  </div>

  <div id="quizSection" style="display:none;" class="section">
    <div class="divider"></div>
    <span class="tag">Quiz Time</span>
    <div class="section-label">Your Answer</div>
    <textarea id="userAnswer" placeholder="Type your answer to the quiz question above..."></textarea>
    <button class="btn btn-success" onclick="checkAnswer()">✅ Check My Answer</button>
    <div id="feedbackSection" style="display:none;">
      <div id="feedback" class="feedback-box"></div>
    </div>
  </div>
</div>

<div class="footer">Powered by Groq + LLaMA 3.1 · Built for ML Empowerment Build Challenge</div>

<script>
let currentTopic = "";
let currentQuestion = "";

function loadingHTML() {
  return `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Thinking...</span></div>`;
}

async function explainTopic() {
  currentTopic = document.getElementById("topic").value.trim();
  if (!currentTopic) return;

  const expSection = document.getElementById("explanationSection");
  const expDiv = document.getElementById("explanation");
  expSection.style.display = "block";
  expDiv.innerHTML = loadingHTML();
  document.getElementById("quizSection").style.display = "none";
  document.getElementById("feedbackSection").style.display = "none";

  const res = await fetch("/explain", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({topic: currentTopic})
  });
  const data = await res.json();
  expDiv.innerText = data.reply;
  currentQuestion = data.reply;

  document.getElementById("quizSection").style.display = "block";
  document.getElementById("userAnswer").value = "";
}

async function checkAnswer() {
  const userAnswer = document.getElementById("userAnswer").value.trim();
  if (!userAnswer) return;

  const fbSection = document.getElementById("feedbackSection");
  const fbDiv = document.getElementById("feedback");
  fbSection.style.display = "block";
  fbDiv.innerHTML = loadingHTML();

  const res = await fetch("/check", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({topic: currentTopic, question: currentQuestion, answer: userAnswer})
  });
  const data = await res.json();
  fbDiv.innerText = data.reply;
}
</script>
</body>
</html>
