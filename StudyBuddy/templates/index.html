<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: #0f0c29;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 60px;
    color: #fff;
  }

  /* HERO */
  .hero {
    text-align: center;
    margin-bottom: 36px;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #c4b5fd;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 3.4rem;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(135deg, #fff 30%, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
  }
  .hero p {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    max-width: 420px;
  }

  /* CARD */
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 36px;
    width: 100%;
    max-width: 660px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.4);
  }

  /* SEARCH */
  .search-wrap {
    display: flex;
    gap: 10px;
  }
  .search-wrap input {
    flex: 1;
    padding: 15px 20px;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: #fff;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.3); }
  .search-wrap input:focus {
    border-color: #a78bfa;
    background: rgba(167,139,250,0.08);
  }
  .btn-explain {
    padding: 15px 22px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(124,58,237,0.4);
  }
  .btn-explain:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(124,58,237,0.55);
  }
  .btn-explain:active { transform: translateY(0); }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin: 28px 0;
  }

  /* SECTION LABEL */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 12px;
  }

  /* CONTENT BLOCKS */
  .explain-block, .quiz-block {
    display: none;
    animation: rise 0.4s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* EXPLANATION */
  .explain-section {
    background: rgba(167,139,250,0.08);
    border: 1px solid rgba(167,139,250,0.2);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .explain-section .icon { font-size: 1.3rem; margin-bottom: 8px; display: block; }
  .explain-section p {
    font-size: 15px;
    line-height: 1.75;
    color: rgba(255,255,255,0.85);
  }

  /* QUIZ */
  .quiz-section {
    background: rgba(251,191,36,0.06);
    border: 1px solid rgba(251,191,36,0.2);
    border-radius: 16px;
    padding: 22px;
  }
  .quiz-section .icon { font-size: 1.3rem; margin-bottom: 8px; display: block; }
  .quiz-question {
    font-size: 15px;
    font-weight: 600;
    color: #fcd34d;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .option-btn {
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 14px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    line-height: 1.4;
  }
  .option-btn:hover {
    background: rgba(167,139,250,0.15);
    border-color: #a78bfa;
    color: #fff;
  }
  .option-btn.selected {
    background: rgba(167,139,250,0.2);
    border-color: #a78bfa;
    color: #fff;
  }
  .option-btn.correct {
    background: rgba(16,185,129,0.2);
    border-color: #10b981;
    color: #6ee7b7;
  }
  .option-btn.wrong {
    background: rgba(239,68,68,0.15);
    border-color: #ef4444;
    color: #fca5a5;
  }

  .btn-submit {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    background: linear-gradient(135deg, #059669, #10b981);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(16,185,129,0.3);
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(16,185,129,0.45);
  }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* FEEDBACK */
  .feedback-section {
    margin-top: 14px;
    background: rgba(16,185,129,0.07);
    border: 1px solid rgba(16,185,129,0.2);
    border-radius: 16px;
    padding: 20px;
    font-size: 15px;
    line-height: 1.75;
    color: rgba(255,255,255,0.85);
    animation: rise 0.4s ease;
    display: none;
  }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    padding: 10px 0;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #a78bfa;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* TRY AGAIN */
  .try-again {
    text-align: center;
    margin-top: 20px;
  }
  .btn-try {
    background: none;
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-try:hover { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.8); }

  /* FOOTER */
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    text-align: center;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">✦ AI-Powered Learning</div>
  <h1>🎓 Study Buddy</h1>
  <p>Type any topic and get an explanation, example, and instant quiz — powered by AI.</p>
</div>

<div class="card">
  <div class="section-label">What are you studying?</div>
  <div class="search-wrap">
    <input type="text" id="topic" placeholder="e.g. Photosynthesis, Recursion, Black Holes..." onkeydown="if(event.key==='Enter') explainTopic()">
    <button class="btn-explain" onclick="explainTopic()">✨ Go</button>
  </div>

  <!-- EXPLANATION -->
  <div id="explainBlock" class="explain-block">
    <div class="divider"></div>
    <div class="section-label">📖 Explanation & Example</div>
    <div id="explanationLoading" class="loading" style="display:none;">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div> Generating explanation...
    </div>
    <div id="explanationContent" style="display:none;">
      <div class="explain-section">
        <span class="icon">💡</span>
        <p id="explanationText"></p>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizBlock" class="quiz-block">
    <div class="divider"></div>
    <div class="section-label">🧠 Test Yourself</div>
    <div class="quiz-section">
      <span class="icon">❓</span>
      <div class="quiz-question" id="quizQuestion"></div>
      <div class="options-grid" id="optionsGrid"></div>
      <button class="btn-submit" id="submitBtn" onclick="checkAnswer()" disabled>Check My Answer</button>
      <div class="feedback-section" id="feedbackSection">
        <div id="feedbackLoading" class="loading" style="display:none;">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div> Checking...
        </div>
        <p id="feedbackText"></p>
      </div>
    </div>

    <div class="try-again">
      <button class="btn-try" onclick="resetQuiz()">↩ Try another topic</button>
    </div>
  </div>
</div>

<div class="footer">Powered by Groq · LLaMA 3.1 · Built for ML Empowerment Build Challenge</div>

<script>
let currentTopic = "";
let currentFullResponse = "";
let selectedOption = "";

function loadingDots() {
  return `<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div> Thinking...</div>`;
}

function parseResponse(text) {
  // Extract explanation+example and quiz question with options separately
  const quizMatch = text.match(/(?:QUIZ|Quiz|quiz)[:\s]*([\s\S]+)/i);
  const quizPart = quizMatch ? quizMatch[1].trim() : "";

  // Everything before QUIZ label is explanation
  const explPart = quizMatch
    ? text.substring(0, text.search(/(?:QUIZ|Quiz|quiz)[:\s]/i)).replace(/^(EXPLANATION|EXAMPLE)[:\s]*/gim, "").trim()
    : text;

  // Parse quiz question and options
  let question = "";
  let options = [];
  if (quizPart) {
    const lines = quizPart.split("\n").map(l => l.trim()).filter(Boolean);
    const optionLines = lines.filter(l => /^[A-D][\)\.]\s/i.test(l));
    const questionLines = lines.filter(l => !/^[A-D][\)\.]\s/i.test(l));
    question = questionLines.join(" ");
    options = optionLines;
  }

  return { explanation: explPart, question, options };
}

async function explainTopic() {
  currentTopic = document.getElementById("topic").value.trim();
  if (!currentTopic) return;

  // Show explanation block with loading
  const explainBlock = document.getElementById("explainBlock");
  explainBlock.style.display = "block";
  document.getElementById("explanationLoading").style.display = "flex";
  document.getElementById("explanationContent").style.display = "none";
  document.getElementById("quizBlock").style.display = "none";
  selectedOption = "";

  const res = await fetch("/explain", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({topic: currentTopic})
  });
  const data = await res.json();
  currentFullResponse = data.reply;

  const parsed = parseResponse(currentFullResponse);

  // Show explanation
  document.getElementById("explanationLoading").style.display = "none";
  document.getElementById("explanationContent").style.display = "block";
  document.getElementById("explanationText").innerText = parsed.explanation;

  // Build quiz
  document.getElementById("quizBlock").style.display = "block";
  document.getElementById("quizQuestion").innerText = parsed.question || "Answer this question based on what you learned:";
  document.getElementById("feedbackSection").style.display = "none";
  document.getElementById("feedbackText").innerText = "";
  document.getElementById("submitBtn").disabled = true;

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  if (parsed.options.length > 0) {
    parsed.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(btn, opt);
      grid.appendChild(btn);
    });
  }
}

function selectOption(btn, value) {
  document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  selectedOption = value;
  document.getElementById("submitBtn").disabled = false;
}

async function checkAnswer() {
  if (!selectedOption) return;
  const fbSection = document.getElementById("feedbackSection");
  const fbText = document.getElementById("feedbackText");
  const fbLoading = document.getElementById("feedbackLoading");

  fbSection.style.display = "block";
  fbLoading.style.display = "flex";
  fbText.innerText = "";
  document.getElementById("submitBtn").disabled = true;

  const res = await fetch("/check", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({topic: currentTopic, question: currentFullResponse, answer: selectedOption})
  });
  const data = await res.json();

  fbLoading.style.display = "none";
  fbText.innerText = data.reply;

  // Color the options based on feedback
  const isCorrect = data.reply.toLowerCase().includes("correct") && !data.reply.toLowerCase().includes("incorrect") && !data.reply.toLowerCase().includes("not correct");
  document.querySelectorAll(".option-btn").forEach(btn => {
    if (btn.classList.contains("selected")) {
      btn.classList.add(isCorrect ? "correct" : "wrong");
    }
  });
}

function resetQuiz() {
  document.getElementById("topic").value = "";
  document.getElementById("explainBlock").style.display = "none";
  document.getElementById("quizBlock").style.display = "none";
  document.getElementById("topic").focus();
}
</script>
</body>
</html>
