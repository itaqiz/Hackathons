# Publishes static hackathon projects in this repository to GitHub Pages.
# Pehchaan ends up at https://<user>.github.io/Hackathons/pehchaan/
name: Deploy static projects to Pages

on:
  push:
    branches: [main]
    paths:
      - "pehchaan/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Pehchaan tests
        run: node --test pehchaan/tests/test_risk.js

      - name: Assemble site
        run: |
          mkdir -p _site/pehchaan
          cp -r pehchaan/app/. _site/pehchaan/
          # Root page sends visitors straight to the app
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=pehchaan/"><a href="pehchaan/">Pehchaan</a>' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
